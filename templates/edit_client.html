<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Client - CoachFlow</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar">
    <div class="logo">CoachFlow</div>

    <div class="nav-links">
        <a href="/dashboard">Dashboard</a>
        <a href="/leads">Leads</a>
        <a href="/clients">Clients</a>
        <a href="/logout">Logout</a>
    </div>
</nav>

<main class="container">

    <div class="page-header">
        <div>
            <h1>Edit Client</h1>
            <p>Update {{ client['client_name'] }}'s information.</p>
        </div>
    </div>

    <div class="form-container">

        <div class="form-card">

            <form method="POST">
                <input
    type="hidden"
    name="csrf_token"
    value="{{ csrf_token() }}"
>

                <div class="form-group">
                    <label for="client_name">Client Name</label>

                    <input
                        type="text"
                        name="client_name"
                        id="client_name"
                        value="{{ client['client_name'] }}"
                        required
                    >
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="email">Email</label>

                        <input
                            type="email"
                            name="email"
                            id="email"
                            value="{{ client['email'] }}"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="phone">Phone</label>

                        <input
                            type="text"
                            name="phone"
                            id="phone"
                            value="{{ client['phone'] }}"
                            required
                        >
                    </div>

                </div>

                <div class="form-group">
                    <label for="goal">Goal</label>

                    <input
                        type="text"
                        name="goal"
                        id="goal"
                        value="{{ client['goal'] }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="notes">Notes</label>

                    <textarea
                        name="notes"
                        id="notes"
                        rows="5"
                        required
                    >{{ client['notes'] }}</textarea>
                </div>
                <div class="form-group">
    <label for="revenue">Revenue (£)</label>

    <input
        type="number"
        id="revenue"
        name="revenue"
        step="0.01"
        min="0"
        value="{{ client['revenue'] or 0 }}"
        required
    >

    <small>
        Enter the amount this client is worth.
    </small>
</div>

                <div class="form-actions">

                    <a
                        href="/client/{{ client['id'] }}"
                        class="button secondary"
                    >
                        Cancel
                    </a>

                    <button type="submit" class="button">
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

</main>

</body>
</html>
